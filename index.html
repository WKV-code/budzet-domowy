<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>Budżet Domowy</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --violet:#7c3aed;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px;font-weight:700}
header .sub{font-size:12px;color:#94a3b8;margin-top:2px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav button{background:#334155;color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px}
.monthnav button:hover{background:#475569}
.monthnav .lbl{min-width:130px;text-align:center;font-weight:600;font-size:15px}
nav.tabs{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
nav.tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:22px;font-weight:700}
.big.pos{color:var(--green)} .big.neg{color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;vertical-align:middle}
.badge.P{background:#dbeafe;color:var(--blue)} .badge.Z{background:#fef3c7;color:var(--amber)}
.badge.t-expense{background:#e2e8f0;color:#475569}
.badge.t-savings{background:#dcfce7;color:var(--green)}
.badge.t-rebalance{background:#ede9fe;color:var(--violet)}
.bar{background:#eef2f7;border-radius:6px;height:8px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;border-radius:6px}
.grouprow td{background:#f8fafc;font-weight:600}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
.amount{width:110px;text-align:right}
.btn{border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;background:var(--blue);color:#fff}
.btn.sec{background:#e2e8f0;color:var(--ink)}
.btn.mini{padding:4px 8px;font-size:12px;font-weight:500}
.btn.danger{background:#fee2e2;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.txn{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
form.txn label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
.kpi-edit{width:120px;text-align:right}
.chart{width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{color:var(--muted);font-size:13px;padding:8px}
.warnbox{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;font-size:13px;margin:12px 0;display:none}
.grouphdr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.progress-list .item{margin-bottom:10px}
.progress-list .top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
@media (max-width:640px){ .amount{width:90px} }
</style>
</head>

var PALETTE = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#475569","#0d9488","#9333ea","#b45309","#059669","#1d4ed8","#be123c","#57534e"];
var TYPE_LABEL = {expense:"wydatek", savings:"oszczędności/inwestycje", rebalance:"rebalancing"};

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pln(v){ v = Math.round((v||0)*100)/100; return v.toLocaleString("pl-PL",{minimumFractionDigits:2,maximumFractionDigits:2}) + " zł"; }
function plnSigned(v,kind){ var s = pln(Math.abs(v)); return (v<0?"-":(kind==="income"?"+":"")) + s; }
function uid(){ return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function currentMonth(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function addMonths(m,delta){ var p=m.split("-"),y=+p[0],mm=+p[1]+delta; while(mm<1){mm+=12;y--;} while(mm>12){mm-=12;y++;} return y+"-"+String(mm).padStart(2,"0"); }
function monthLabel(m){ var p=m.split("-"); var s=new Intl.DateTimeFormat("pl-PL",{month:"long",year:"numeric"}).format(new Date(+p[0],+p[1]-1,1)); return s.charAt(0).toUpperCase()+s.slice(1); }
function shortMonth(m){ var p=m.split("-"); return new Intl.DateTimeFormat("pl-PL",{month:"short"}).format(new Date(+p[0],+p[1]-1,1)); }
function parseAmount(v){ v=String(v||"").replace(/\s/g,"").replace(/−/g,"-").replace(",","."); var n=parseFloat(v); return isNaN(n)?0:Math.round(n*100)/100; }

// ---------- stan ----------
var state, month, activeTab="pulpit", editTxnId=null;

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ var s=JSON.parse(raw); if(s && s.version===2){ migrateLiquid(s); return s; } }
    if(raw && localStorage.getItem("budzet-domowy-html-v1")){
      // stara wersja (v1) nie jest zgodna z modelem; zaczynamy od danych z arkusza
      return JSON.parse(JSON.stringify(SEED));
    }
  }catch(e){}
  return null;
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showStorageWarn(); }
  try{ var _m=syncLoadMeta(); _m.dirty=true; syncSaveMeta(_m); }catch(e){}
  try{ syncAutoSchedule(); }catch(e){}
}
function showStorageWarn(){
  var w=document.getElementById("storage-warn");
  w.style.display="block";
  w.innerHTML="Nie udało się zapisać danych w pamięci przeglądarki (localStorage). Aplikacja działa, ale zmiany znikną po zamknięciu. Proszę regularnie eksportować kopię JSON. (Safari potrafi blokować localStorage dla plików otwieranych z dysku.)";
}

// ---------- dostępy do modelu ----------
function groupById(id){ for(var i=0;i<state.groups.length;i++) if(state.groups[i].id===id) return state.groups[i]; return null; }
function subById(id){ for(var i=0;i<state.subcats.length;i++) if(state.subcats[i].id===id) return state.subcats[i]; return null; }
function incById(id){ for(var i=0;i<state.incomeCats.length;i++) if(state.incomeCats[i].id===id) return state.incomeCats[i]; return null; }
function groupColor(gid){ for(var i=0;i<state.groups.length;i++) if(state.groups[i].id===gid) return PALETTE[i%PALETTE.length]; return "#94a3b8"; }
function subsOf(gid){ return state.subcats.filter(function(s){ return s.groupId===gid; }); }
function txnsOf(m){ return state.txns.filter(function(t){ return t.date.slice(0,7)===m; }); }

// ---------- obliczenia ----------
function sums(m){
  var tx=txnsOf(m), r={income:0,expense:0,savings:0,rebalance:0,passive:0,passiveByCat:{}};
  for(var i=0;i<tx.length;i++){
    var t=tx[i];
    if(t.kind==="income"){
      r.income+=t.amount;
      var ic=incById(t.catId);
      if(ic&&ic.passive){ r.passive+=t.amount; r.passiveByCat[ic.name]=(r.passiveByCat[ic.name]||0)+t.amount; }
    }else{
      var s=subById(t.catId), g=s?groupById(s.groupId):null;
      if(!g){ r.expense+=t.amount; continue; }
      if(g.type==="expense") r.expense+=t.amount;
      else if(g.type==="savings") r.savings+=t.amount;
      else if(g.type==="rebalance") r.rebalance+=t.amount;
    }
  }
  for(var k in r){ if(typeof r[k]==="number") r[k]=Math.round(r[k]*100)/100; }
  return r;
}
function planOf(m,subId){ return state.budgets[m+"::sub:"+subId]||0; }
function setPlan(m,subId,v){ var k=m+"::sub:"+subId; if(v) state.budgets[k]=v; else delete state.budgets[k]; saveState(); }
function incPlanOf(m,incId){ return state.incomePlans[m+"::inc:"+incId]||0; }
function setIncPlan(m,incId,v){ var k=m+"::inc:"+incId; if(v) state.incomePlans[k]=v; else delete state.incomePlans[k]; saveState(); }
function kpi(m,key,val){ var k=m+"::"+key; if(arguments.length===2) return (k in state.kpiManual)? state.kpiManual[k] : null; if(val!==null&&!isNaN(val)) state.kpiManual[k]=Math.round(val*100)/100; else delete state.kpiManual[k]; saveState(); }
function budgetRows(m){
  return state.groups.map(function(g){
    var subs=subsOf(g.id).map(function(s){
      var plan=planOf(m,s.id), spent=spentOf(m,s.id);
      return {sub:s, plan:plan, spent:spent, left:Math.round((plan-spent)*100)/100};
    });
    var plan=subs.reduce(function(a,x){return a+x.plan;},0);
    var spent=subs.reduce(function(a,x){return a+x.spent;},0);
    return {group:g, subs:subs, plan:Math.round(plan*100)/100, spent:Math.round(spent*100)/100, left:Math.round((plan-spent)*100)/100};
  });
}
function spentOf(m,subId){
  var t=0, tx=txnsOf(m);
  for(var i=0;i<tx.length;i++) if(tx[i].kind==="expense" && tx[i].catId===subId) t+=tx[i].amount;
  return Math.round(t*100)/100;
}
function incSpentOf(m,incId){
  var t=0, tx=txnsOf(m);
  for(var i=0;i<tx.length;i++) if(tx[i].kind==="income" && tx[i].catId===incId) t+=tx[i].amount;
  return Math.round(t*100)/100;
}
function cardInfo(){
  var i,s;
  for(i=0;i<state.subcats.length;i++){ s=state.subcats[i]; if(s.cardLimit!=null) return {sub:s, limit:+s.cardLimit}; }
  for(i=0;i<state.subcats.length;i++){
    s=state.subcats[i];
    if(/karta\s*kredytowa/i.test(s.name)){
      var mm=s.name.match(/limit\s+([0-9][0-9\s.,]*)/i), lim=mm?parseAmount(mm[1]):1000;
      if(!lim||lim<=0) lim=1000;
      return {sub:s, limit:lim};
    }
  }
  return null;
}
function cardStan(m){ var ci=cardInfo(); return ci?Math.round((spentOf(m,ci.sub.id)+ci.limit)*100)/100:null; }
function nadplataOf(m){
  for(var i=0;i<state.subcats.length;i++){ var sb=state.subcats[i]; if(/nadpłata\s*kredytu/i.test(sb.name)) return spentOf(m,sb.id); }
  return 0;
}
function oszczCalc(m){
  var ci=cardInfo(), saldo=ci?spentOf(m,ci.sub.id):0, s=sums(m);
  return Math.round((saldo+s.rebalance+s.savings)*100)/100;
}
function oszczPoprz(m){
  var man=kpi(m,"oszczpoprz");
  if(man!==null) return man;
  var pm=addMonths(m,-1);
  if(txnsOf(pm).length) return oszczCalc(pm);
  return null;
}
function defaultTxnDate(){
  var t=new Date(), td=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  return td.slice(0,7)===month ? td : month+"-01";
}
function szacPrzych(m){
  var v=kpi(m,"szacprzychod"); if(v!==null) return v;
  var w=kpi(m,"wplyny"); if(w!==null) return w;
  return state.incomeCats.reduce(function(a,c){ return a+incPlanOf(m,c.id); },0);
}
function zeroBudget(m){
  var s=sums(m);
  var planTotal=state.subcats.reduce(function(a,x){ return a+planOf(m,x.id); },0);
  var srodki=Math.round((liquidTotal(addMonths(m,-1))+szacPrzych(m))*100)/100;
  var wplynyPlan = state.incomeCats.reduce(function(a,x){ return a+incPlanOf(m,x.id); },0);
  var wplyny = kpi(m,"wplyny"); if(wplyny===null) wplyny=wplynyPlan;
  return {
    srodki:srodki, plan:Math.round(planTotal*100)/100,
    left:Math.round((srodki-planTotal)*100)/100,
    wplyny:wplyny, income:s.income, s:s
  };
}

// ---------- trendy / wykresy ----------
function trendMonths(m){ var a=[]; for(var i=5;i>=0;i--) a.push(addMonths(m,-i)); return a; }
function trendSVG(m){
  var ms=trendMonths(m), rows=ms.map(function(x){ var s=sums(x); return {m:x, inc:s.income, exp:s.expense+s.savings+s.rebalance}; });
  var max=Math.max.apply(null,rows.map(function(r){return Math.max(r.inc,r.exp);})); if(max<=0) max=1;
  var W=600,H=200,padB=24,bw=18,gap=28, step=(W-40)/(rows.length);
  var bars="", labels="";
  for(var i=0;i<rows.length;i++){
    var x=30+i*step;
    var h1=Math.max(2,rows[i].inc/max*(H-padB-10)), h2=Math.max(2,rows[i].exp/max*(H-padB-10));
    bars+='<rect x="'+(x)+'" y="'+(H-padB-h1)+'" width="'+bw+'" height="'+h1+'" rx="3" fill="#16a34a" opacity="0.9"><title>'+shortMonth(rows[i].m)+': przychód '+pln(rows[i].inc)+'</title></rect>';
    bars+='<rect x="'+(x+bw+4)+'" y="'+(H-padB-h2)+'" width="'+bw+'" height="'+h2+'" rx="3" fill="#dc2626" opacity="0.85"><title>'+shortMonth(rows[i].m)+': obciążenia '+pln(rows[i].exp)+'</title></rect>';
    labels+='<text x="'+(x+bw)+'" y="'+(H-6)+'" font-size="11" fill="#64748b" text-anchor="middle">'+shortMonth(rows[i].m)+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+bars+labels+'</svg>';
}

// ---------- płynne środki na koniec poprzedniego miesiąca ----------
function migrateLiquid(s){
  if(!s) return;
  if(s.liquid && Array.isArray(s.liquid.positions) && s.liquid.manual) return;
  var pos=[];
  function addByGroupType(ty){
    s.groups.forEach(function(g){
      if(g.type!==ty) return;
      s.subcats.forEach(function(sb){ if(sb.groupId===g.id) pos.push({id:"l-"+sb.id, name:sb.name, subId:sb.id}); });
    });
  }
  addByGroupType("rebalance");
  addByGroupType("savings");
  var ci=null, i;
  for(i=0;i<s.subcats.length;i++){ if(s.subcats[i].cardLimit!=null){ ci=s.subcats[i]; break; } }
  if(!ci){ for(i=0;i<s.subcats.length;i++){ if(/karta\s*kredytowa/i.test(s.subcats[i].name)){ ci=s.subcats[i]; break; } } }
  if(ci && !pos.some(function(p){ return p.subId===ci.id; })) pos.push({id:"l-"+ci.id, name:"Karta kredytowa", subId:ci.id});
  s.liquid={ positions:pos, manual:{} };
}
function liqById(id){
  if(!state.liquid) migrateLiquid(state);
  for(var i=0;i<state.liquid.positions.length;i++){ if(state.liquid.positions[i].id===id) return state.liquid.positions[i]; }
  return null;
}
function liquidComputed(pos,pm){
  if(!pos.subId) return null;
  var ci=cardInfo();
  if(ci && ci.sub.id===pos.subId){ var cv=cardStan(pm); return (cv===null)?0:cv; }
  return spentOf(pm,pos.subId);
}
function liquidManual(pm,posId){ var k=pm+"::pos:"+posId; return (k in state.liquid.manual)?state.liquid.manual[k]:null; }
function liquidVal(pos,pm){
  var man=liquidManual(pm,pos.id); if(man!==null) return man;
  var c=liquidComputed(pos,pm); return (c===null)?0:c;
}
function liquidTotal(pm){
  if(!state.liquid) migrateLiquid(state);
  var t=0; state.liquid.positions.forEach(function(p){ t+=liquidVal(p,pm); });
  return Math.round(t*100)/100;
}
function liquidCarryList(m){
  if(!state.liquid) migrateLiquid(state);
  var pm=addMonths(m,-1), out=[], sum=0, ci=cardInfo();
  state.liquid.positions.forEach(function(p){
    if(!p.subId) return;
    if(!(subById(p.subId))) return;
    var k=m+"::sub:"+p.subId;
    if(k in state.budgets) return;
    var v=Math.round(liquidVal(p,pm)*100)/100;
    if(ci && ci.sub && ci.sub.id===p.subId) v=Math.round((v-ci.limit)*100)/100;
    if(!v) return;
    out.push({posId:p.id, subId:p.subId, val:v});
    sum+=v;
  });
  return {list:out, n:out.length, sum:Math.round(sum*100)/100};
}
function setLiquidManual(pm,posId,v){
  if(!state.liquid) migrateLiquid(state);
  var k=pm+"::pos:"+posId;
  if(v!==null && !isNaN(v)) state.liquid.manual[k]=Math.round(v*100)/100; else delete state.liquid.manual[k];
  saveState();
}
function liquidLinkOptions(sel){
  var h='<option value="">\u2013 brak powiązania \u2013</option>';
  state.groups.forEach(function(g){
    var subs=subsOf(g.id);
    if(!subs.length) return;
    h+='<optgroup label="'+esc(g.name)+'">';
    subs.forEach(function(s){ h+='<option value="'+s.id+'"'+(sel===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; });
    h+='</optgroup>';
  });
  return h;
}
function renderPlynne(){
  if(!state.liquid) migrateLiquid(state);
  var pm=addMonths(month,-1);
  var h='<div class="card"><h3>Płynne środki na koniec '+monthLabel(pm)+'</h3>'

    +'<div style="overflow-x:auto"><table><tr><th>Opis</th><th>Powiązanie (Budżety \u2192 Wykonanie)</th><th class="num">Z wykonania</th><th class="num">Wpisany stan</th><th class="num">Stan</th><th></th></tr>';
  state.liquid.positions.forEach(function(p){
    var comp=liquidComputed(p,pm), man=liquidManual(pm,p.id);
    h+="<tr><td><input data-lname='"+p.id+"' value=\""+esc(p.name)+"\" style=\"width:100%\"></td>"
      +'<td><select data-llink="'+p.id+'">'+liquidLinkOptions(p.subId)+'</select></td>'
      +'<td class="num mut">'+((comp===null)?"-":pln(comp))+'</td>'

}

}

// ---------- akcje ----------
function findTxn(id){ for(var i=0;i<state.txns.length;i++) if(state.txns[i].id===id) return state.txns[i]; return null; }
function fillForm(t){
  window.__txnKind=t.kind;
  window.__txnCat=(t.kind==="income"?"i:":"s:")+t.catId;
  window.__txnDate=t.date;
  editTxnId=t.id;
  activeTab="transakcje"; renderView();
  var a=document.getElementById("f-amount"); if(a){ a.value=t.amount.toString().replace(".",","); a.focus(); }
}
function submitTxn(){
  var kind=document.getElementById("f-kind").value;
  var catRaw=document.getElementById("f-cat").value;
  var date=document.getElementById("f-date").value;
  var amount=parseAmount(document.getElementById("f-amount").value);
  var note=document.getElementById("f-note").value.trim();
  if(!catRaw||!date||amount===0){ alert("Proszę podać kategorię, datę i kwotę różną od zera."); return; }
  if(kind==="income"&&amount<0){ alert("Kwota dochodu nie może być ujemna. Ujemne kwoty są dostępne dla obciążeń (np. rozchód z karty)."); return; }
  var catId=catRaw.slice(2), isIncome=catRaw.slice(0,2)==="i:";
  if(isIncome!== (kind==="income")){ alert("Wybrana kategoria nie pasuje do rodzaju transakcji."); return; }
  if(editTxnId){
    var t=findTxn(editTxnId);
    if(t){ t.kind=kind; t.catId=catId; t.date=date; t.amount=amount; t.note=note||null; }
    editTxnId=null; window.__txnKind=null; window.__txnCat=null; window.__txnDate=null;
  }else{
    state.txns.push({id:uid(), date:date, kind:kind, catId:catId, amount:amount, note:note||null});
  }
  saveState(); renderView();
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="budzet-domowy-"+month+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
}
function importJSON(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var s=JSON.parse(rd.result);
      if(!s||s.version!==2||!Array.isArray(s.groups)||!Array.isArray(s.subcats)||!Array.isArray(s.txns)) throw new Error("bad");
      state=s; migrateLiquid(state); saveState(); month=state.month||month; renderAll();
    }catch(e){ alert("Plik nie wygląda na kopię tej aplikacji (oczekiwano formatu v2)."); }
  };
  rd.readAsText(file);
}

// ---------- synchronizacja (GitHub, szyfrowana) ----------
var SYNC_CFG_KEY="budzet-sync-cfg", SYNC_META_KEY="budzet-sync-meta", SYNC_FILE="budzet.dat";
var syncMsg=null, syncBusy=false;

function syncLoadCfg(){
  try{ var r=localStorage.getItem(SYNC_CFG_KEY); if(r){ var c=JSON.parse(r); if(c&&c.repo) return c; } }catch(e){}
  return null;
}
function syncSaveCfg(c){ try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(c)); return true; }catch(e){ return false; } }
function syncLoadMeta(){
  try{ var r=localStorage.getItem(SYNC_META_KEY); if(r){ var m=JSON.parse(r); if(m) return m; } }catch(e){}
  return { dirty:false, lastPush:null, lastPull:null, lastRemoteAt:null };
}
function syncSaveMeta(m){ try{ localStorage.setItem(SYNC_META_KEY, JSON.stringify(m)); }catch(e){} }
function syncFmtDate(iso){
  try{
    var d=new Date(iso);
    var p=function(x){ return ("0"+x).slice(-2); };
    return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes());
  }catch(e){ return String(iso); }
}

// --- kryptografia (WebCrypto: PBKDF2 + AES-GCM) ---
function syncB64Enc(u8){
  var s="", CH=0x8000;
  for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(s);
}
function syncB64Dec(str){
  var bin=atob(str), u8=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++) u8[j]=bin.charCodeAt(j);
  return u8;
}
function syncKey(pass, salt){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), {name:"PBKDF2"}, false, ["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:100000, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  });
}
function syncEncrypt(text, pass){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return syncKey(pass, salt).then(function(key){
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, new TextEncoder().encode(text));
  }).then(function(ct){
    return "BS1:"+syncB64Enc(salt)+"."+syncB64Enc(iv)+"."+syncB64Enc(new Uint8Array(ct));
  });
}
function syncDecrypt(payload, pass){
  if(!payload || payload.indexOf("BS1:")!==0) return Promise.reject(new Error("Nieznany format zaszyfrowanych danych."));
  var parts=payload.slice(4).split(".");
  if(parts.length!==3) return Promise.reject(new Error("Uszkodzony plik synchronizacji."));
  var salt=syncB64Dec(parts[0]), iv=syncB64Dec(parts[1]), ct=syncB64Dec(parts[2]);
  return syncKey(pass, salt).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
  }).then(function(pt){
    return new TextDecoder().decode(pt);
  }).catch(function(){
    throw new Error("Nie udało się odszyfrować: błędne hasło szyfrowania albo uszkodzone dane.");
  });
}

// --- kod przenoszenia konfiguracji między urządzeniami ---
function syncCodeMake(c){
  var json=JSON.stringify({ magic:"BDSYNC1", repo:c.repo, token:c.token, pass:c.pass, auto:c.auto!==false });
  return "BDSYNC1:"+syncB64Enc(new TextEncoder().encode(json));
}
function syncCodeRead(code){
  var s=(code||"").replace(/\s+/g,"");
  if(s.indexOf("BDSYNC1:")!==0) throw new Error("Wklejony tekst nie wygląda na kod konfiguracji tej aplikacji (powinien zaczynać się od BDSYNC1:).");
  var json=new TextDecoder().decode(syncB64Dec(s.slice(8)));
  var o=JSON.parse(json);
  if(!o || o.magic!=="BDSYNC1" || !o.repo || !o.token || !o.pass) throw new Error("Kod jest uszkodzony lub niekompletny.");
  return { repo:o.repo, token:o.token, pass:o.pass, auto:o.auto!==false };
}

// --- GitHub Contents API ---
function syncHeaders(cfg){
  return { "Authorization":"Bearer "+cfg.token, "Accept":"application/vnd.github+json",
           "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json" };
}
function syncUrl(cfg){ return "https://api.github.com/repos/"+cfg.repo+"/contents/"+SYNC_FILE; }
function ghGetFile(cfg){
  return fetch(syncUrl(cfg)+"?ref=main&t="+Date.now(), { headers:syncHeaders(cfg), cache:"no-store" }).then(function(res){
    if(res.status===404) return null;
    if(!res.ok) return res.text().then(function(t){ throw new Error("GitHub "+res.status+": "+t.slice(0,180)); });
    return res.json();
  }).then(function(j){
    if(!j) return { found:false };
    return { found:true, sha:j.sha, payload:atob((j.content||"").replace(/\s/g,"")) };
  });
}
function ghPutFile(cfg, payloadStr, sha){
  var body={ message:"budzet-domowy sync "+new Date().toISOString(), branch:"main", content:btoa(payloadStr) };
  if(sha) body.sha=sha;
  return fetch(syncUrl(cfg), { method:"PUT", headers:syncHeaders(cfg), body:JSON.stringify(body) }).then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error("GitHub "+res.status+": "+t.slice(0,180)); });
    return res.json();
  });
}

// --- operacje ---
function syncReadCfgInputs(){
  return {
    repo:(document.getElementById("sync-repo").value||"").trim(),
    token:(document.getElementById("sync-token").value||"").trim(),
    pass:document.getElementById("sync-pass").value||"",
    auto:(document.getElementById("sync-auto")||{}).checked!==false
  };
}
function syncValidateCfg(c){
  if(!c.repo || c.repo.indexOf("/")<1){ alert("Proszę podać repozytorium w formacie użytkownik/repo, np. WKV-code/budzet-sync (repozytorium musi być prywatne)."); return false; }
  if(!c.token || c.token.length<20){ alert("Proszę podać token dostępowy GitHub (github.com → Settings → Developer settings → Fine-grained tokens)."); return false; }
  if(!c.pass || c.pass.length<6){ alert("Hasło szyfrowania musi mieć co najmniej 6 znaków."); return false; }
  return true;
}
function syncStatus(msg){ syncMsg=msg; try{ renderView(); }catch(e){} }

function syncPush(){
  var c=syncReadCfgInputs();
  if(!syncValidateCfg(c)) return Promise.resolve(false);
  syncSaveCfg(c);
  syncBusy=true; syncStatus("Wysyłanie na serwer...");
  var payload={ magic:"BUDZETSYNC", v:1, updatedAt:new Date().toISOString(), data:null };
  return syncEncrypt(JSON.stringify(state), c.pass).then(function(enc){
    payload.data=enc;
    return ghGetFile(c).then(function(g){ return ghPutFile(c, JSON.stringify(payload), (g&&g.found)?g.sha:null); });
  }).then(function(){
    var m=syncLoadMeta(); m.dirty=false; m.lastPush=payload.updatedAt; m.lastRemoteAt=payload.updatedAt; syncSaveMeta(m);
    syncStatus("Wysłano na serwer ("+syncFmtDate(payload.updatedAt)+"). To urządzenie ma najnowszą wersję danych.");
    return true;
  }).catch(function(err){
    syncStatus("Wysyłanie nie powiodło się: "+((err&&err.message)?err.message:String(err)));
    return false;
  }).then(function(r){ syncBusy=false; try{ renderView(); }catch(e){} return r; });
}

function syncPull(auto){
  var c;
  if(auto){
    c=syncLoadCfg();
    if(!c || !c.token || !c.pass || !c.auto) return Promise.resolve(null);
  }else{
    c=syncReadCfgInputs();
    if(!syncValidateCfg(c)) return Promise.resolve(false);
    syncSaveCfg(c);
  }
  syncBusy=true;
  if(!auto) syncStatus("Pobieranie z serwera...");
  var m=syncLoadMeta();
  return ghGetFile(c).then(function(g){
    if(!g || !g.found){
      if(!auto) syncStatus("Na serwerze nie ma jeszcze danych. Proszę najpierw użyć przycisku \u201eWyślij na serwer\u201d.");
      return null;
    }
    var payload;
    try{ payload=JSON.parse(g.payload); }catch(e){ throw new Error("Plik na serwerze ma nieprawidłowy format."); }
    if(!payload || payload.magic!=="BUDZETSYNC") throw new Error("Plik na serwerze nie wygląda na kopię synchronizacji tej aplikacji.");
    if(payload.updatedAt && m.lastRemoteAt && payload.updatedAt<=m.lastRemoteAt){
      if(!auto) syncStatus("Brak nowych danych na serwerze (wersja z "+syncFmtDate(payload.updatedAt)+").");
      return null;
    }
    if(m.dirty && payload.updatedAt!==m.lastRemoteAt){
      if(auto){
        syncStatus("Synchronizacja wstrzymana: na serwerze jest nowsza wersja, ale to urządzenie ma niewysłane lokalne zmiany. Proszę rozstrzygnąć ręcznie: Dane → Synchronizacja.");
        return null;
      }
      if(!confirm("Pobranie z serwera nadpisze lokalne dane, \u0142\u0105cznie z niewysłanymi zmianami tego urządzenia.\n\nKontynuować?")){ syncStatus("Pobranie anulowane."); return null; }
    }
    return syncDecrypt(payload.data, c.pass).then(function(txt){
      var s;
      try{ s=JSON.parse(txt); }catch(e){ throw new Error("Odszyfrowane dane nie są poprawnym JSON-em."); }
      if(!s || s.version!==2 || !Array.isArray(s.groups) || !Array.isArray(s.txns)) throw new Error("Odszyfrowane dane nie są zgodne z formatem aplikacji (v2).");
      state=s; migrateLiquid(state); month=(state.month&&state.month.length>=7)?state.month.slice(0,7):currentMonth(); editTxnId=null;
      saveState();
      var m2=syncLoadMeta(); m2.dirty=false; m2.lastPull=new Date().toISOString(); m2.lastRemoteAt=payload.updatedAt; syncSaveMeta(m2);
      syncStatus((auto?"Zaktualizowano dane z serwera":"Pobrano dane z serwera")+" (wersja z "+syncFmtDate(payload.updatedAt)+").");
      return true;
    });
  }).catch(function(err){
    var msg=(err&&err.message)?err.message:String(err);
    if(auto && /fetch|network|load failed/i.test(msg)) return false; // offline przy starcie: cisza
    syncStatus((auto?"Autosynchronizacja nie powiodła się: ":(/fetch|network|load failed/i.test(msg)?"Brak połączenia z internetem: ":"Pobieranie nie powiodło się: "))+msg);
    return false;
  }).then(function(r){ syncBusy=false; try{ renderView(); }catch(e){} return r; });
}

// --- automatyczne wysyłanie zmian na serwer (od wersji 14) ---
var syncAutoTimer=null;
function syncAutoSchedule(){
  if(syncAutoTimer){ try{ clearTimeout(syncAutoTimer); }catch(e){} syncAutoTimer=null; }
  var c=syncLoadCfg();
  if(!c || !c.token || !c.pass || c.auto===false) return;
  if(!syncLoadMeta().dirty) return;
  syncAutoTimer=setTimeout(function(){ syncAutoTimer=null; syncAutoPush(); }, 20000);
}
function syncAutoPush(){
  var c=syncLoadCfg();
  if(!c || !c.token || !c.pass || c.auto===false) return Promise.resolve(null);
  var m=syncLoadMeta();
  if(!m.dirty || syncBusy) return Promise.resolve(null);
  syncBusy=true;
  var snap=JSON.stringify(state);
  var payload={ magic:"BUDZETSYNC", v:1, updatedAt:new Date().toISOString(), data:null };
  return ghGetFile(c).then(function(g){
    var srvAt=null;
    if(g && g.found){ try{ srvAt=(JSON.parse(g.payload)||{}).updatedAt||null; }catch(e){} }
    if(srvAt && (!m.lastRemoteAt || srvAt>m.lastRemoteAt)){
      syncStatus("Auto-wysyłanie wstrzymane: na serwerze jest nowsza wersja danych, której to urządzenie jeszcze nie pobrało. Proszę rozstrzygnąć ręcznie: Dane \u2192 Synchronizacja.");
      return false;
    }
    return syncEncrypt(JSON.stringify(state), c.pass).then(function(enc){
      payload.data=enc;
      return ghPutFile(c, JSON.stringify(payload), (g&&g.found)?g.sha:null);
    }).then(function(){
      var m2=syncLoadMeta();
      m2.dirty=(JSON.stringify(state)!==snap);
      m2.lastPush=payload.updatedAt; m2.lastRemoteAt=payload.updatedAt;
      syncSaveMeta(m2);
      syncStatus("Zmiany wysłane automatycznie na serwer ("+syncFmtDate(payload.updatedAt)+").");
      if(m2.dirty) syncAutoSchedule();
      return true;
    });
  }).catch(function(err){
    var msg=(err&&err.message)?err.message:String(err);
    if(!/fetch|network|load failed/i.test(msg)) syncStatus("Auto-wysyłanie nie powiodło się: "+msg);
    return false;
  }).then(function(r){ syncBusy=false; try{ renderView(); }catch(e){} return r; });
}
function syncFlushOnExit(){
  try{
    if(syncAutoTimer){ try{ clearTimeout(syncAutoTimer); }catch(e){} syncAutoTimer=null; }
    if(syncLoadMeta().dirty) syncAutoPush();
  }catch(e){}
}

  }
  else if(a==="sync-clear"){
    if(confirm("Usunąć ustawienia synchronizacji z tego urządzenia (token i hasło)?\n\nDane lokalne i dane na serwerze pozostają bez zmian.")){
      try{ localStorage.removeItem(SYNC_CFG_KEY); }catch(e){}
      syncMsg=null; renderView();
    }
  }
  else if(a==="add-liquid"){
    var nL=(document.getElementById("nl-name").value||"").trim(), lkL=document.getElementById("nl-link").value;
    if(!nL){ alert("Proszę podać nazwę nowej pozycji."); return; }
    state.liquid.positions.push({id:"l-"+uid(), name:nL, subId:lkL||null});
    saveState(); renderView();
  }
  else if(a==="del-liquid"){
    if(confirm("Usunąć pozycję płynnych środków?\n\nNie usuwa to kategorii ani transakcji; znika tylko ta pozycja z tej zakładki.")){
      state.liquid.positions=state.liquid.positions.filter(function(p){ return p.id!==id; });
      for(var kL in state.liquid.manual){ if(kL.endsWith("::pos:"+id)) delete state.liquid.manual[kL]; }
      saveState(); renderView();
    }
  }
  else if(a==="clear"){
    if(confirm("Usunąć WSZYSTKIE dane (transakcje, budżety, kategorie) i przywrócić stan początkowy?")){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state=JSON.parse(JSON.stringify(SEED)); month=state.month||currentMonth(); editTxnId=null; renderAll();
    }
  }
});
document.getElementById("import-file").addEventListener("change",function(ev){
  var f=ev.target.files[0]; if(f) importJSON(f); ev.target.value="";
});
document.getElementById("view").addEventListener("submit",function(ev){
  if(ev.target && ev.target.id==="txn-form"){ ev.preventDefault(); submitTxn(); }
});
document.getElementById("view").addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="f-kind"){ window.__txnKind=t.value; window.__txnCat=null; renderView(); return; }
  var d;
  if(t.hasAttribute && (d=t.getAttribute("data-plan"))){ setPlan(month,d,parseAmount(t.value)); renderView(); }
  else if(t.hasAttribute && (d=t.getAttribute("data-incplan"))){ setIncPlan(month,d,parseAmount(t.value)); renderView(); }
  else if(t.hasAttribute && (d=t.getAttribute("data-kpi"))){
    var v=t.value.trim()?parseAmount(t.value):null;
    kpi(month,d,v);
    if(d==="szacprzychod"||d==="wplyny"||d==="oszczpoprz") renderView();
  }
  else if(t.hasAttribute && (d=t.getAttribute("data-lname"))){
    var lp=liqById(d); if(lp && t.value.trim()){ lp.name=t.value.trim(); saveState(); }
  }
  else if(t.hasAttribute && (d=t.getAttribute("data-llink"))){
    var lp2=liqById(d); if(lp2){ lp2.subId=t.value||null; saveState(); renderView(); }
  }
  else if(t.hasAttribute && (d=t.getAttribute("data-lstan"))){
    setLiquidManual(addMonths(month,-1), d, t.value.trim()?parseAmount(t.value):null);
    renderView();
  }
  else if(t.hasAttribute && (d=t.getAttribute("data-gname"))){ var g=groupById(d); if(g&&t.value.trim()){ g.name=t.value.trim(); saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-gtype"))){ var g2=groupById(d); if(g2){ g2.type=t.value; saveState(); renderView(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-sname"))){ var s=subById(d); if(s&&t.value.trim()){ s.name=t.value.trim(); saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-spz"))){ var s2=subById(d); if(s2){ s2.pz=t.value||null; saveState(); renderView(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-snote"))){ var s3=subById(d); if(s3){ s3.note=t.value.trim()||null; saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-iname"))){ var c=incById(d); if(c&&t.value.trim()){ c.name=t.value.trim(); saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-ipassive"))){ var c2=incById(d); if(c2){ c2.passive=t.checked; saveState(); } }
});

// ---------- start ----------
state=loadState();
if(!state){ state=JSON.parse(JSON.stringify(SEED)); saveState(); }
month=(state.month&&state.month.length>=7)?state.month.slice(0,7):currentMonth();
try{ if(!localStorage.getItem(STORAGE_KEY)) saveState(); }catch(e){ showStorageWarn(); }
try{
  // świeże urządzenie (stan = przykładowy seed) nie ma lokalnych zmian do stracenia
  if(JSON.stringify(state)===JSON.stringify(SEED)){
    var _m0=syncLoadMeta();
    if(!_m0.lastPush && !_m0.lastPull){ _m0.dirty=false; syncSaveMeta(_m0); }
  }
}catch(e){}
renderAll();
setTimeout(function(){ syncPull(true); }, 400);
setTimeout(function(){ syncAutoPush(); }, 12000);
window.addEventListener("pagehide", syncFlushOnExit);
window.addEventListener("beforeunload", syncFlushOnExit);
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
