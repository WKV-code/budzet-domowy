<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>Budżet Domowy</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --violet:#7c3aed;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px;font-weight:700}
header .sub{font-size:12px;color:#94a3b8;margin-top:2px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav button{background:#334155;color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px}
.monthnav button:hover{background:#475569}
.monthnav .lbl{min-width:130px;text-align:center;font-weight:600;font-size:15px}
nav.tabs{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
nav.tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:22px;font-weight:700}
.big.pos{color:var(--green)} .big.neg{color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;vertical-align:middle}
.badge.P{background:#dbeafe;color:var(--blue)} .badge.Z{background:#fef3c7;color:var(--amber)}
.badge.t-expense{background:#e2e8f0;color:#475569}
.badge.t-savings{background:#dcfce7;color:var(--green)}
.badge.t-rebalance{background:#ede9fe;color:var(--violet)}
.bar{background:#eef2f7;border-radius:6px;height:8px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;border-radius:6px}
.grouprow td{background:#f8fafc;font-weight:600}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
.amount{width:110px;text-align:right}
.btn{border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;background:var(--blue);color:#fff}
.btn.sec{background:#e2e8f0;color:var(--ink)}
.btn.mini{padding:4px 8px;font-size:12px;font-weight:500}
.btn.danger{background:#fee2e2;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.txn{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
form.txn label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
.kpi-edit{width:120px;text-align:right}
.chart{width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{color:var(--muted);font-size:13px;padding:8px}
.warnbox{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;font-size:13px;margin:12px 0;display:none}
.grouphdr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.progress-list .item{margin-bottom:10px}
.progress-list .top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
@media (max-width:640px){ .amount{width:90px} }
</style>

var PALETTE = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#475569","#0d9488","#9333ea","#b45309","#059669","#1d4ed8","#be123c","#57534e"];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pln(v){ v = Math.round((v||0)*100)/100; return v.toLocaleString("pl-PL",{minimumFractionDigits:2,maximumFractionDigits:2}) + " zł"; }
function plnSigned(v,kind){ var s = pln(Math.abs(v)); return (v<0?"-":(kind==="income"?"+":"")) + s; }
function uid(){ return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function currentMonth(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function addMonths(m,delta){ var p=m.split("-"),y=+p[0],mm=+p[1]+delta; while(mm<1){mm+=12;y--;} while(mm>12){mm-=12;y++;} return y+"-"+String(mm).padStart(2,"0"); }
function monthLabel(m){ var p=m.split("-"); var s=new Intl.DateTimeFormat("pl-PL",{month:"long",year:"numeric"}).format(new Date(+p[0],+p[1]-1,1)); return s.charAt(0).toUpperCase()+s.slice(1); }
function shortMonth(m){ var p=m.split("-"); return new Intl.DateTimeFormat("pl-PL",{month:"short"}).format(new Date(+p[0],+p[1]-1,1)); }
function parseAmount(v){ v=String(v||"").replace(/\s/g,"").replace(/−/g,"-").replace(",","."); var n=parseFloat(v); return isNaN(n)?0:Math.round(n*100)/100; }

// ---------- stan ----------
var state, month, activeTab="pulpit", editTxnId=null;

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ var s=JSON.parse(raw); if(s && s.version===2) return s; }
    if(raw && localStorage.getItem("budzet-domowy-html-v1")){
      // stara wersja (v1) nie jest zgodna z modelem; zaczynamy od danych z arkusza
      return JSON.parse(JSON.stringify(SEED));
    }
  }catch(e){}
  return null;
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showStorageWarn(); }
}
function showStorageWarn(){
  var w=document.getElementById("storage-warn");
  w.style.display="block";
  w.innerHTML="Nie udało się zapisać danych w pamięci przeglądarki (localStorage). Aplikacja działa, ale zmiany znikną po zamknięciu. Proszę regularnie eksportować kopię JSON. (Safari potrafi blokować localStorage dla plików otwieranych z dysku.)";
}

// ---------- dostępy do modelu ----------
function groupById(id){ for(var i=0;i<state.groups.length;i++) if(state.groups[i].id===id) return state.groups[i]; return null; }
function subById(id){ for(var i=0;i<state.subcats.length;i++) if(state.subcats[i].id===id) return state.subcats[i]; return null; }
function incById(id){ for(var i=0;i<state.incomeCats.length;i++) if(state.incomeCats[i].id===id) return state.incomeCats[i]; return null; }
function groupColor(gid){ for(var i=0;i<state.groups.length;i++) if(state.groups[i].id===gid) return PALETTE[i%PALETTE.length]; return "#94a3b8"; }
function subsOf(gid){ return state.subcats.filter(function(s){ return s.groupId===gid; }); }
function txnsOf(m){ return state.txns.filter(function(t){ return t.date.slice(0,7)===m; }); }

// ---------- obliczenia ----------
function sums(m){
  var tx=txnsOf(m), r={income:0,expense:0,savings:0,rebalance:0,passive:0,passiveByCat:{}};
  for(var i=0;i<tx.length;i++){
    var t=tx[i];
    if(t.kind==="income"){
      r.income+=t.amount;
      var ic=incById(t.catId);
      if(ic&&ic.passive){ r.passive+=t.amount; r.passiveByCat[ic.name]=(r.passiveByCat[ic.name]||0)+t.amount; }
    }else{
      var s=subById(t.catId), g=s?groupById(s.groupId):null;
      if(!g){ r.expense+=t.amount; continue; }
      if(g.type==="expense") r.expense+=t.amount;
      else if(g.type==="savings") r.savings+=t.amount;
      else if(g.type==="rebalance") r.rebalance+=t.amount;
    }
  }
  for(var k in r){ if(typeof r[k]==="number") r[k]=Math.round(r[k]*100)/100; }
  return r;
}
function planOf(m,subId){ return state.budgets[m+"::sub:"+subId]||0; }
function setPlan(m,subId,v){ var k=m+"::sub:"+subId; if(v) state.budgets[k]=v; else delete state.budgets[k]; saveState(); }
function incPlanOf(m,incId){ return state.incomePlans[m+"::inc:"+incId]||0; }
function setIncPlan(m,incId,v){ var k=m+"::inc:"+incId; if(v) state.incomePlans[k]=v; else delete state.incomePlans[k]; saveState(); }
function kpi(m,key,val){ var k=m+"::"+key; if(arguments.length===2) return (k in state.kpiManual)? state.kpiManual[k] : null; if(val!==null&&!isNaN(val)) state.kpiManual[k]=Math.round(val*100)/100; else delete state.kpiManual[k]; saveState(); }
function budgetRows(m){
  return state.groups.map(function(g){
    var subs=subsOf(g.id).map(function(s){
      var plan=planOf(m,s.id), spent=spentOf(m,s.id);
      return {sub:s, plan:plan, spent:spent, left:Math.round((plan-spent)*100)/100};
    });
    var plan=subs.reduce(function(a,x){return a+x.plan;},0);
    var spent=subs.reduce(function(a,x){return a+x.spent;},0);
    return {group:g, subs:subs, plan:Math.round(plan*100)/100, spent:Math.round(spent*100)/100, left:Math.round((plan-spent)*100)/100};
  });
}
function spentOf(m,subId){
  var t=0, tx=txnsOf(m);
  for(var i=0;i<tx.length;i++) if(tx[i].kind==="expense" && tx[i].catId===subId) t+=tx[i].amount;
  return Math.round(t*100)/100;
}
function incSpentOf(m,incId){
  var t=0, tx=txnsOf(m);
  for(var i=0;i<tx.length;i++) if(tx[i].kind==="income" && tx[i].catId===incId) t+=tx[i].amount;
  return Math.round(t*100)/100;
}
function cardInfo(){
  var i,s;
  for(i=0;i<state.subcats.length;i++){ s=state.subcats[i]; if(s.cardLimit!=null) return {sub:s, limit:+s.cardLimit}; }
  for(i=0;i<state.subcats.length;i++){
    s=state.subcats[i];
    if(/karta\s*kredytowa/i.test(s.name)){
      var mm=s.name.match(/limit\s+([0-9][0-9\s.,]*)/i), lim=mm?parseAmount(mm[1]):1000;
      if(!lim||lim<=0) lim=1000;
      return {sub:s, limit:lim};
    }
  }
  return null;
}
function cardStan(m){ var ci=cardInfo(); return ci?Math.round((spentOf(m,ci.sub.id)+ci.limit)*100)/100:null; }
function defaultTxnDate(){
  var t=new Date(), td=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  return td.slice(0,7)===month ? td : month+"-01";
}
function zeroBudget(m){
  var s=sums(m);
  var planTotal=state.subcats.reduce(function(a,x){ return a+planOf(m,x.id); },0);
  var srodki = kpi(m,"srodki"); if(srodki===null) srodki=s.income;
  var wplynyPlan = state.incomeCats.reduce(function(a,x){ return a+incPlanOf(m,x.id); },0);
  var wplyny = kpi(m,"wplyny"); if(wplyny===null) wplyny=wplynyPlan;
  return {
    srodki:srodki, plan:Math.round(planTotal*100)/100,
    left:Math.round((srodki-planTotal)*100)/100,
    wplyny:wplyny, income:s.income, s:s
  };
}

// ---------- trendy / wykresy ----------
function trendMonths(m){ var a=[]; for(var i=5;i>=0;i--) a.push(addMonths(m,-i)); return a; }
function trendSVG(m){
  var ms=trendMonths(m), rows=ms.map(function(x){ var s=sums(x); return {m:x, inc:s.income, exp:s.expense+s.savings+s.rebalance}; });
  var max=Math.max.apply(null,rows.map(function(r){return Math.max(r.inc,r.exp);})); if(max<=0) max=1;
  var W=600,H=200,padB=24,bw=18,gap=28, step=(W-40)/(rows.length);
  var bars="", labels="";
  for(var i=0;i<rows.length;i++){
    var x=30+i*step;
    var h1=Math.max(2,rows[i].inc/max*(H-padB-10)), h2=Math.max(2,rows[i].exp/max*(H-padB-10));
    bars+='<rect x="'+(x)+'" y="'+(H-padB-h1)+'" width="'+bw+'" height="'+h1+'" rx="3" fill="#16a34a" opacity="0.9"><title>'+shortMonth(rows[i].m)+': przychód '+pln(rows[i].inc)+'</title></rect>';
    bars+='<rect x="'+(x+bw+4)+'" y="'+(H-padB-h2)+'" width="'+bw+'" height="'+h2+'" rx="3" fill="#dc2626" opacity="0.85"><title>'+shortMonth(rows[i].m)+': obciążenia '+pln(rows[i].exp)+'</title></rect>';
    labels+='<text x="'+(x+bw)+'" y="'+(H-6)+'" font-size="11" fill="#64748b" text-anchor="middle">'+shortMonth(rows[i].m)+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+bars+labels+'</svg>';
}

// ---------- tabs ----------
var TABS=[["pulpit","Pulpit"],["transakcje","Transakcje"],["budzety","Budżety"],["dane","Kategorie i dane"]];
function renderTabs(){
  var h="";
  for(var i=0;i<TABS.length;i++)
    h+='<button data-tab="'+TABS[i][0]+'" class="'+(activeTab===TABS[i][0]?"active":"")+'">'+TABS[i][1]+'</button>';
  document.getElementById("tabs").innerHTML=h;
}
function catOptions(selKind, selected, subFilter){
  var h="";
  if(selKind!=="expense"){
    h+='<optgroup label="Dochody">';
    state.incomeCats.forEach(function(c){ h+='<option value="i:'+c.id+'"'+(selected==="i:"+c.id?" selected":"")+">"+esc(c.name)+(c.passive?" (Z/S)":"")+"</option>"; });
    h+="</optgroup>";
  }
  if(selKind!=="income"){
    state.groups.forEach(function(g){
      var subs=subsOf(g.id).filter(subFilter||function(){return true;});
      if(!subs.length) return;
      h+='<optgroup label="'+esc(g.name)+'">';
      subs.forEach(function(s){ h+='<option value="s:'+s.id+'"'+(selected==="s:"+s.id?" selected":"")+">"+esc(s.name)+"</option>"; });
      h+="</optgroup>";
    });
  }
  return h;
}

// ---------- pulpit ----------

  var z=zeroBudget(month), s=z.s, m=month;

  var przeplyw=Math.round((s.income-s.expense-s.savings-s.rebalance)*100)/100;

  var h='<div class="grid g3">';
  h+='<div class="card"><h3>Środki do rozdysponowania</h3><div class="big">'+pln(z.srodki)+'</div>'

  h+='<div class="card"><h3>Oszczędności i inwestycje (mies.)</h3><div class="big" style="color:var(--green)">'+pln(s.savings)+'</div><div class="hint">Realizacja celów oszczędnościowych</div></div>';
  h+='<div class="card"><h3>Rebalancing (mies.)</h3><div class="big" style="color:var(--violet)">'+pln(s.rebalance)+'</div><div class="hint">Przepływy między kontami/portfelem</div></div>';
  h+='<div class="card"><h3>Z/S ALL (dochód pasywny)</h3><div class="big" style="color:var(--blue)">'+pln(s.passive)+'</div>'
    +'<div class="hint">'+(zstable.length? zstable.map(function(x){return esc(x.name)+": "+pln(x.v);}).join(" · ") : "brak zysków pasywnych w tym miesiącu")+'</div></div>';

  }

    +'<input class="kpi-edit" data-kpi="oszczednosci" data-init="1" value="'+(osz!==null?osz:"")+'" placeholder="0,00" size="10"></div>';

// ---------- główny render ----------
function renderView(){
  var el=document.getElementById("view"), h="";
  if(activeTab==="pulpit") h=renderPulpit();
  else if(activeTab==="transakcje") h=renderTransakcje();
  else if(activeTab==="budzety") h=renderBudzety();
  else h=renderDane();
  el.innerHTML=h;
}
function renderAll(){
  document.getElementById("month-label").textContent=monthLabel(month);
  renderTabs(); renderView();
}

// ---------- akcje ----------
function findTxn(id){ for(var i=0;i<state.txns.length;i++) if(state.txns[i].id===id) return state.txns[i]; return null; }
function fillForm(t){
  window.__txnKind=t.kind;
  window.__txnCat=(t.kind==="income"?"i:":"s:")+t.catId;
  window.__txnDate=t.date;
  editTxnId=t.id;
  activeTab="transakcje"; renderView();
  var a=document.getElementById("f-amount"); if(a){ a.value=t.amount.toString().replace(".",","); a.focus(); }
}
function submitTxn(){
  var kind=document.getElementById("f-kind").value;
  var catRaw=document.getElementById("f-cat").value;
  var date=document.getElementById("f-date").value;
  var amount=parseAmount(document.getElementById("f-amount").value);
  var note=document.getElementById("f-note").value.trim();
  if(!catRaw||!date||amount===0){ alert("Proszę podać kategorię, datę i kwotę różną od zera."); return; }
  if(kind==="income"&&amount<0){ alert("Kwota dochodu nie może być ujemna. Ujemne kwoty są dostępne dla obciążeń (np. rozchód z karty)."); return; }
  var catId=catRaw.slice(2), isIncome=catRaw.slice(0,2)==="i:";
  if(isIncome!== (kind==="income")){ alert("Wybrana kategoria nie pasuje do rodzaju transakcji."); return; }
  if(editTxnId){
    var t=findTxn(editTxnId);
    if(t){ t.kind=kind; t.catId=catId; t.date=date; t.amount=amount; t.note=note||null; }
    editTxnId=null; window.__txnKind=null; window.__txnCat=null; window.__txnDate=null;
  }else{
    state.txns.push({id:uid(), date:date, kind:kind, catId:catId, amount:amount, note:note||null});
  }
  saveState(); renderView();
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="budzet-domowy-"+month+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
}
function importJSON(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var s=JSON.parse(rd.result);
      if(!s||s.version!==2||!Array.isArray(s.groups)||!Array.isArray(s.subcats)||!Array.isArray(s.txns)) throw new Error("bad");
      state=s; saveState(); month=state.month||month; renderAll();
    }catch(e){ alert("Plik nie wygląda na kopię tej aplikacji (oczekiwano formatu v2)."); }
  };
  rd.readAsText(file);
}

document.getElementById("prev-month").addEventListener("click",function(){ month=addMonths(month,-1); editTxnId=null; renderAll(); });
document.getElementById("next-month").addEventListener("click",function(){ month=addMonths(month,1); editTxnId=null; renderAll(); });
document.getElementById("tabs").addEventListener("click",function(ev){
  var b=ev.target.closest("button[data-tab]"); if(!b) return;
  activeTab=b.getAttribute("data-tab"); renderTabs(); renderView();
});
document.getElementById("view").addEventListener("click",function(ev){
  var el=ev.target.closest("[data-action]"); if(!el) return;
  var a=el.getAttribute("data-action"), id=el.getAttribute("data-id");
  if(a==="edit-txn"){ var t=findTxn(id); if(t) fillForm(t); }
  else if(a==="del-txn"){ if(confirm("Usunąć tę transakcję?")){ state.txns=state.txns.filter(function(x){return x.id!==id;}); saveState(); renderView(); } }
  else if(a==="cancel-edit"){ editTxnId=null; window.__txnKind=null; window.__txnCat=null; window.__txnDate=null; renderView(); }
  else if(a==="toggle-sign"){
    var ta=document.getElementById("f-amount");
    if(ta){ var tv=ta.value.trim(); ta.value=(tv.charAt(0)==="-")?tv.slice(1):(tv?"-"+tv:tv); ta.focus(); }
  }
  else if(a==="add-group"){
    var n=document.getElementById("ng-name").value.trim(), ty=document.getElementById("ng-type").value;
    if(!n){ alert("Proszę podać nazwę grupy."); return; }
    state.groups.push({id:"g-"+uid(), name:n, type:ty}); saveState(); renderView();
  }
  else if(a==="del-group"){ if(confirm("Usunąć grupę (możliwa tylko bez podkategorii)?")){ state.groups=state.groups.filter(function(g){return g.id!==id;}); saveState(); renderView(); } }
  else if(a==="add-sub"){
    var gid=document.getElementById("ns-group").value, sn=document.getElementById("ns-name").value.trim(), pz=document.getElementById("ns-pz").value;
    if(!sn){ alert("Proszę podać nazwę podkategorii."); return; }
    state.subcats.push({id:"s-"+uid(), groupId:gid, name:sn, pz:pz||null, note:null}); saveState(); renderView();
  }
  else if(a==="del-sub"){
    var has=state.txns.some(function(t){ return t.catId===id; });
    var msg=has?"Ta podkategoria ma transakcje. Usunąć ją razem z nimi?":"Usunąć podkategorię?";
    if(confirm(msg)){
      state.txns=state.txns.filter(function(t){ return t.catId!==id; });
      state.subcats=state.subcats.filter(function(s){ return s.id!==id; });
      for(var k in state.budgets){ if(k.endsWith("::sub:"+id)) delete state.budgets[k]; }
      saveState(); renderView();
    }
  }
  else if(a==="add-inc"){
    var nn=document.getElementById("ni-name").value.trim(), pas=document.getElementById("ni-passive").checked;
    if(!nn){ alert("Proszę podać nazwę źródła dochodu."); return; }
    state.incomeCats.push({id:"i-"+uid(), name:nn, passive:pas}); saveState(); renderView();
  }
  else if(a==="del-inc"){
    var hi=state.txns.some(function(t){ return t.catId===id; });
    var mi=hi?"To źródło ma transakcje. Usunąć je razem z nimi?":"Usunąć źródło dochodu?";
    if(confirm(mi)){
      state.txns=state.txns.filter(function(t){ return t.catId!==id; });
      state.incomeCats=state.incomeCats.filter(function(c){ return c.id!==id; });
      for(var k2 in state.incomePlans){ if(k2.endsWith("::inc:"+id)) delete state.incomePlans[k2]; }
      saveState(); renderView();
    }
  }
  else if(a==="export"){ exportJSON(); }
  else if(a==="import"){ document.getElementById("import-file").click(); }
  else if(a==="clear"){
    if(confirm("Usunąć WSZYSTKIE dane (transakcje, budżety, kategorie) i przywrócić stan początkowy?")){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state=JSON.parse(JSON.stringify(SEED)); month=state.month||currentMonth(); editTxnId=null; renderAll();
    }
  }
});
document.getElementById("import-file").addEventListener("change",function(ev){
  var f=ev.target.files[0]; if(f) importJSON(f); ev.target.value="";
});
document.getElementById("view").addEventListener("submit",function(ev){
  if(ev.target && ev.target.id==="txn-form"){ ev.preventDefault(); submitTxn(); }
});
document.getElementById("view").addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="f-kind"){ window.__txnKind=t.value; window.__txnCat=null; renderView(); return; }
  var d;
  if(t.hasAttribute && (d=t.getAttribute("data-plan"))){ setPlan(month,d,parseAmount(t.value)); renderView(); }
  else if(t.hasAttribute && (d=t.getAttribute("data-incplan"))){ setIncPlan(month,d,parseAmount(t.value)); renderView(); }
  else if(t.hasAttribute && (d=t.getAttribute("data-kpi"))){
    var v=t.value.trim()?parseAmount(t.value):null;
    kpi(month,d,v);
    if(d==="srodki"||d==="wplyny"||d==="oszczednosci") renderView();
  }
  else if(t.hasAttribute && (d=t.getAttribute("data-gname"))){ var g=groupById(d); if(g&&t.value.trim()){ g.name=t.value.trim(); saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-gtype"))){ var g2=groupById(d); if(g2){ g2.type=t.value; saveState(); renderView(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-sname"))){ var s=subById(d); if(s&&t.value.trim()){ s.name=t.value.trim(); saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-spz"))){ var s2=subById(d); if(s2){ s2.pz=t.value||null; saveState(); renderView(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-snote"))){ var s3=subById(d); if(s3){ s3.note=t.value.trim()||null; saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-iname"))){ var c=incById(d); if(c&&t.value.trim()){ c.name=t.value.trim(); saveState(); } }
  else if(t.hasAttribute && (d=t.getAttribute("data-ipassive"))){ var c2=incById(d); if(c2){ c2.passive=t.checked; saveState(); } }
});

// ---------- start ----------
state=loadState();
if(!state){ state=JSON.parse(JSON.stringify(SEED)); saveState(); }
month=(state.month&&state.month.length>=7)?state.month.slice(0,7):currentMonth();
try{ if(!localStorage.getItem(STORAGE_KEY)) saveState(); }catch(e){ showStorageWarn(); }
renderAll();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
</body>
